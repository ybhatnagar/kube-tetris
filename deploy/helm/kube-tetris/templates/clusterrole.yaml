{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-tetris.fullname" . }}
  labels:
    {{- include "kube-tetris.labels" . | nindent 4 }}
rules:
  # READ — the collector needs these for planning and pre-flight checks.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]

  {{- if not .Values.rbac.readOnly }}
  # WRITE — the executor needs these to apply approved migrations. Nothing here
  # can delete an unowned pod; the eviction subresource enforces PDBs; and node
  # patches are limited to cordon / uncordon.
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  {{- end }}
{{- end }}
