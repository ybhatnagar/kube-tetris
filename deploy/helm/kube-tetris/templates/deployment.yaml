apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-tetris.fullname" . }}
  labels:
    {{- include "kube-tetris.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-tetris.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-tetris.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kube-tetris.serviceAccountName" . }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- if .Values.persistence.enabled }}
            - name: KUBETETRIS_JOURNAL_STORAGE
              value: "file"
            - name: KUBETETRIS_JOURNAL_PATH
              value: "{{ .Values.persistence.mountPath }}/journal"
            - name: KUBETETRIS_REGISTRY_PATH
              value: "{{ .Values.persistence.mountPath }}/registry"
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kube-tetris.fullname" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
